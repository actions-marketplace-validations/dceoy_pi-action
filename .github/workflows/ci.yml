---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  bats-test:
    permissions:
      contents: read
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    uses: dceoy/gha-for-devops/.github/workflows/bats-test.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
  github-actions-lint-and-scan:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      search-path: .github/workflows
      yamllint-search-path: .
      zizmor-search-path: .
  markdown-lint:
    permissions:
      contents: read
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      search-path: .
  shell-lint:
    if: >
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/shell-lint.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      search-path: .
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs:
      - bats-test
      - github-actions-lint-and-scan
      - markdown-lint
      - shell-lint
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@b7d9e0c64d9cd6d7198da715b11a4648373e9a23  # v2.3.4
    with:
      unconditional: true
